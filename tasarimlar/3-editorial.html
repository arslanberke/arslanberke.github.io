<!doctype html><html lang="tr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 · Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="frames.css">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;background:#f3efe7;color:#1c1a17}
header{display:flex;justify-content:space-between;padding:22px 5vw;font-size:14px;border-bottom:1px solid #d9d2c3}header a{color:inherit;margin-left:20px;text-decoration:none}
.hero{padding:9vh 5vw 6vh}.hero h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(64px,12vw,190px);line-height:.88;letter-spacing:-.03em}
.hero h1 em{color:#c2410c}.line{display:block;overflow:hidden}.line span{display:inline-block;transform:translateY(110%);animation:up 1.1s cubic-bezier(.2,.8,.2,1) forwards}.line:nth-child(2) span{animation-delay:.15s}
@keyframes up{to{transform:none}}
.sub{display:flex;justify-content:space-between;gap:40px;margin-top:40px;font-size:18px;line-height:1.6;color:#5c554a}.sub p{max-width:520px}
.ticker{border-block:1px solid #1c1a17;overflow:hidden;padding:16px 0;font-family:"Instrument Serif";font-size:40px;font-style:italic}
.ticker div{display:flex;gap:50px;width:max-content;animation:t 30s linear infinite}@keyframes t{to{transform:translateX(-50%)}}
.work{padding:10vh 5vw}.row{display:grid;grid-template-columns:80px 1fr 1.2fr;gap:40px;padding:60px 0;border-top:1px solid #d9d2c3;align-items:start}
.num{font-family:"Instrument Serif";font-size:44px;color:#a8a090}.row h2{font-family:"Instrument Serif";font-weight:400;font-size:64px;line-height:1;letter-spacing:-.02em}
.row .k{text-transform:uppercase;font-size:12px;letter-spacing:.15em;color:#8a8273;margin-bottom:12px}.row p{margin-top:20px;line-height:1.7;color:#4c463d;max-width:440px}
.row .tags{margin-top:18px;font-size:13px;color:#8a8273}
.shots{display:flex;gap:16px;justify-content:flex-end}.shots .dev-phone{width:190px}.shots .dev-phone:nth-child(2){transform:translateY(40px)}.shots .dev-win{width:100%}
.row .shots>*{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.row:hover .shots>*{transform:translateY(-8px)}
.foot{padding:12vh 5vw;background:#1c1a17;color:#f3efe7}.foot h2{font-family:"Instrument Serif";font-weight:400;font-size:clamp(48px,8vw,120px);line-height:.95}.foot a{color:#fdba74}
@media(max-width:860px){.row{grid-template-columns:1fr}.shots{justify-content:flex-start}.shots .dev-phone{width:140px}.sub{flex-direction:column}}
</style></head><body>
<header><b>Berke Arslan</b><nav><a href="#">İşler</a><a href="#">Hakkımda</a><a href="#">EN</a></nav></header>
<section class="hero"><h1><span class="line"><span>Mobil &amp; web</span></span><span class="line"><span>ürünleri <em>uçtan uca.</em></span></span></h1>
<div class="sub"><p id="lead"></p><p>İstanbul · 2026<br>Şu an: SportPulse</p></div></section>
<div class="ticker"><div id="tk"></div></div>
<section class="work" id="w"></section>
<section class="foot"><h2>Bir fikrin mi var?<br><a href="mailto:arslanberke95@gmail.com">Yaz bana →</a></h2></section>
<script src="data.js"></script><script src="reveal.js"></script><script>
lead.textContent=ME.lead;const T=["React Native","Next.js","Supabase","TypeScript","Python","MapLibre","Prisma","Expo"];tk.innerHTML=[...T,...T].map(t=>`<span>${t} ✦</span>`).join("");
w.innerHTML=PROJECTS.map((p,i)=>`<article class="row reveal"><div class="num">0${i+1}</div><div><div class="k">${p.kind}</div><h2>${p.name}</h2><p>${p.desc}</p><div class="tags">${p.tags.join(" · ")}</div></div><div class="shots">${p.type==="phone"?frame(p,0)+(p.shots[1]?frame(p,1):""):frame(p,0)}</div></article>`).join("");observeReveal();
</script></body></html>
