<!doctype html><html lang="tr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 · Spotlight</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="frames.css">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;background:#0a0a0b;color:#ededed}
.spot{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px circle at var(--x,50%) var(--y,30%),rgba(120,119,198,.16),transparent 60%);z-index:0}
.hero{position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px}
.hero h1{font-size:clamp(48px,9vw,120px);letter-spacing:-.05em;font-weight:800;line-height:.95;background:linear-gradient(180deg,#fff,#777);-webkit-background-clip:text;color:transparent}
.hero p{max-width:560px;color:#999;font-size:18px;line-height:1.6;margin-top:22px}
.scroll{margin-top:50px;font-size:12px;color:#666;letter-spacing:.2em;animation:sc 2s infinite}@keyframes sc{50%{transform:translateY(8px)}}
.case{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:1150px;margin:auto;padding:0 24px}
.sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:300px;aspect-ratio:100/214}
.stage .dev-phone,.stage .dev-win{position:absolute;inset:0;opacity:0;transform:scale(.92) translateY(30px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.stage .dev-win{inset:auto;top:30%;left:-40%;width:180%}
.stage .on{opacity:1;transform:none}
.glow{position:absolute;inset:-30%;border-radius:50%;filter:blur(70px);opacity:.35;transition:background .8s}
.steps .st{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-right:30px;opacity:.25;transition:opacity .5s}.steps .st.act{opacity:1}
.st small{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:.14em}.st h2{font-size:52px;letter-spacing:-.04em;margin:10px 0 18px}.st p{color:#a1a1a1;font-size:18px;line-height:1.65}
.st ul{list-style:none;padding:0;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}.st li{border:1px solid #2a2a2e;padding:6px 12px;border-radius:99px;font-size:13px;color:#ccc}
.st a{margin-top:26px;color:#fff;font-weight:600}
.cta{text-align:center;padding:20vh 20px}.cta h2{font-size:clamp(40px,6vw,80px);letter-spacing:-.04em}.cta a{display:inline-block;margin-top:30px;padding:16px 28px;background:#fff;color:#000;border-radius:99px;font-weight:700;text-decoration:none}
@media(max-width:860px){.case{grid-template-columns:1fr}.sticky{height:60vh;top:0;z-index:2;background:#0a0a0b}.stage{width:180px}.steps .st{min-height:70vh}}
</style></head><body><div class="spot"></div>
<section class="hero"><h1>Berke Arslan</h1><p id="lead"></p><div class="scroll">AŞAĞI KAYDIR ↓</div></section>
<section class="case"><div class="sticky"><div class="stage" id="stage"><div class="glow" id="glow"></div></div></div><div class="steps" id="steps"></div></section>
<section class="cta"><h2>Sıradaki proje seninki olabilir.</h2><a href="mailto:arslanberke95@gmail.com">İletişime geç</a></section>
<script src="data.js"></script><script>
lead.textContent=ME.lead;const P=PROJECTS;
stage.insertAdjacentHTML("beforeend",P.map((p,i)=>frame(p,0,"s"+i)).join(""));
steps.innerHTML=P.map((p,i)=>`<div class="st" data-i="${i}"><small>0${i+1} · ${p.kind}</small><h2>${p.name}</h2><p>${p.desc}</p><ul>${p.tags.map(t=>`<li>${t}</li>`).join("")}</ul>${p.repo?`<a href="${p.repo}">GitHub'da incele →</a>`:`<a>Özel repo</a>`}</div>`).join("");
const items=[...stage.querySelectorAll(".dev-phone,.dev-win")];
const show=i=>{items.forEach((el,k)=>el.classList.toggle("on",k===i));document.querySelectorAll(".st").forEach((s,k)=>s.classList.toggle("act",k===i));glow.style.background=P[i].accent};show(0);
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&show(+e.target.dataset.i)),{rootMargin:"-45% 0px -45% 0px"});document.querySelectorAll(".st").forEach(s=>io.observe(s));
addEventListener("pointermove",e=>{document.body.style.setProperty("--x",e.clientX+"px");document.body.style.setProperty("--y",e.clientY+"px")});
</script></body></html>
