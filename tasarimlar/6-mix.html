<!doctype html><html lang="tr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 · Karma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="frames.css">
<style>
*{box-sizing:border-box;margin:0}a{color:inherit;text-decoration:none}
body{font-family:Inter,sans-serif;background:#0a0a0b;color:#ededed;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}
.spot{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(500px circle at var(--x,50%) var(--y,30%),rgba(255,255,255,.035),transparent 60%)}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:22px;align-items:center;padding:10px 22px;border-radius:99px;background:rgba(10,10,11,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);z-index:10;font-size:14px}
nav a{color:#c8cbe0}nav a:hover{color:#fff}nav b{color:#fff}
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;max-width:1200px;margin:auto;padding:120px 24px 60px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:rgba(16,185,129,.12);color:#6ee7b7;font-size:13px;border:1px solid rgba(16,185,129,.3)}
.badge i,.dot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 10px transparent}}
h1{font-size:clamp(44px,7vw,88px);line-height:1;letter-spacing:-.04em;margin:22px 0;font-weight:800}
h1 span{background:linear-gradient(180deg,#a1a1aa,#52525b);-webkit-background-clip:text;color:transparent}
.lead{font-size:18px;color:#a3a8c3;max-width:520px;line-height:1.6}
.btns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{padding:13px 22px;border-radius:12px;color:#fff;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);font-weight:600;transition:background .2s}.btn:hover{background:rgba(255,255,255,.12)}.btn.p{background:#fff;color:#07080d}
.stack{position:relative;height:620px;perspective:1200px;transition:transform .2s}
.stack .dev-phone{position:absolute;width:250px}
.stack .a{left:4%;top:50px;rotate:-8deg;animation:bob 6s ease-in-out infinite}.stack .b{left:34%;top:0;z-index:2;animation:bob 6s -2s ease-in-out infinite}.stack .c{left:64%;top:80px;rotate:8deg;animation:bob 6s -4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -18px}}
.sec-h{max-width:1150px;margin:auto;padding:80px 24px 0}.sec-h small{color:#8b90ad;letter-spacing:.16em;font-size:12px;text-transform:uppercase}.sec-h h2{font-size:clamp(36px,5vw,56px);letter-spacing:-.04em;margin-top:8px}
.case{display:grid;grid-template-columns:1fr 1fr;max-width:1150px;margin:auto;padding:0 24px}
.sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:290px;aspect-ratio:100/214}
.stage .dev-phone,.stage .dev-win{position:absolute;inset:0;opacity:0;transform:scale(.92) translateY(30px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.stage .dev-win{inset:auto;top:28%;left:-45%;width:190%}.stage .on{opacity:1;transform:none}
.glow{position:absolute;inset:-25%;border-radius:50%;filter:blur(80px);opacity:.14;transition:background .8s}
.st{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-left:40px;opacity:.2;transition:opacity .5s}.st.act{opacity:1}
.st small{font-size:13px;color:#8b90ad;text-transform:uppercase;letter-spacing:.14em}.st h3{font-size:52px;letter-spacing:-.04em;margin:10px 0 18px}.st p{color:#b2b6cc;font-size:18px;line-height:1.65}
.st ul{list-style:none;padding:0;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}.st li{background:#111113;border:1px solid #1f1f23;padding:6px 12px;border-radius:99px;font-size:13px;color:#d6d9ea}
.st .lnk{margin-top:26px;font-weight:600;display:inline-flex;gap:6px}.st .lnk.priv{color:#8b90ad;font-weight:500}
.wrap{max-width:1150px;margin:auto;padding:30px 24px 40px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.t{position:relative;border-radius:24px;padding:26px;background:#111113;border:1px solid #1f1f23;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s}
.t:hover{transform:translateY(-4px);border-color:#34343a}
.t h4{font-size:13px;color:#8b90ad;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:12px}.t p{color:#c8cbe0;line-height:1.6;font-size:15px}
.s2{grid-column:span 2}.r2{grid-row:span 2}
.about{display:flex;gap:20px;align-items:flex-start}.av{width:84px;height:84px;border-radius:22px;flex:none;background:url(shots/avatar.jpg) center/cover}
.about h3{font-size:26px;letter-spacing:-.02em}.about .role{color:#6ee7b7;font-weight:600;margin:4px 0 10px}
.stat b{display:block;font-size:52px;letter-spacing:-.04em;line-height:1}.stat span{color:#8b90ad;font-size:14px}
.marq-w{grid-column:span 4;padding:20px 0;overflow:hidden;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq{display:flex;gap:10px;width:max-content;animation:m 30s linear infinite}.marq span{padding:10px 16px;border-radius:12px;background:#111113;border:1px solid #1f1f23;color:#a1a1aa;white-space:nowrap;font-weight:500}@keyframes m{to{transform:translateX(-50%)}}
.cv{background:#ededed;color:#0a0a0b;border:0;display:flex;flex-direction:column;justify-content:space-between;min-height:220px}.cv h4{color:#71717a}.cv b{font-size:28px;letter-spacing:-.02em;line-height:1.15}
.cv .dl{align-self:flex-start;margin-top:20px;padding:12px 18px;border-radius:12px;background:#0a0a0b;color:#fff;font-weight:700}
.mail{display:flex;flex-direction:column;justify-content:space-between;min-height:220px}.mail b{font-size:24px;word-break:break-all}
.mail button{align-self:flex-start;margin-top:16px;border:0;cursor:pointer;padding:10px 16px;border-radius:12px;background:#1f1f23;color:#fff;font:600 14px Inter}
.soc{display:flex;flex-direction:column;justify-content:space-between;min-height:220px}.soc b{font-size:22px}.soc .ar{position:absolute;right:22px;top:22px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:transform .3s}.soc:hover .ar{transform:rotate(-45deg);background:#fff;color:#000}
footer{text-align:center;padding:40px 20px 60px;color:#6b7090;font-size:14px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.stack{height:440px}.stack .dev-phone{width:170px}.case{grid-template-columns:1fr}.sticky{height:62vh;z-index:2}.stage{width:170px}.st{min-height:70vh;padding-left:0}.st h3{font-size:38px}.grid{grid-template-columns:1fr 1fr}.s2,.marq-w{grid-column:span 2}nav{gap:14px}}
</style></head><body>
<div class="bg"></div><div class="spot"></div>
<nav><b>berke.cc</b><a href="#work">Projeler</a><a href="#cv">CV</a><a href="#contact">İletişim</a><a href="#">EN</a></nav>
<header class="hero"><div><span class="badge"><i></i>AI ile ürün geliştiriyorum</span><h1>Berke Arslan<br><span>fikirleri ürüne çevirir.</span></h1><p class="lead" id="lead"></p>
<div class="btns"><a class="btn p" href="#work">Projeler</a><a class="btn" href="#cv">CV</a><a class="btn" href="https://github.com/arslanberke">GitHub</a></div></div>
<div class="stack" id="stack"></div></header>

<div class="sec-h" id="work"><small>Seçili işler</small><h2>Yaptığım ürünler</h2></div>
<section class="case"><div class="sticky"><div class="stage" id="stage"><div class="glow" id="glow"></div></div></div><div id="steps"></div></section>

<div class="sec-h" id="cv"><small>Özgeçmiş</small><h2>Hakkımda & nasıl çalışıyorum</h2></div>
<div class="wrap"><div class="grid" id="bento"></div></div>

<div class="sec-h" id="contact"><small>İletişim</small><h2>Birlikte çalışalım.</h2></div>
<div class="wrap"><div class="grid" id="contactg"></div></div>
<footer>© 2026 Berke Arslan · berke.cc</footer>

<script src="data.js"></script><script src="reveal.js"></script><script>
const P=PROJECTS;lead.textContent=ME.lead;
stack.innerHTML=frame(P[1],0,"a")+frame(P[0],0,"b")+frame(P[4],0,"c");
stage.insertAdjacentHTML("beforeend",P.map(p=>frame(p,0)).join(""));
steps.innerHTML=P.map((p,i)=>`<div class="st" data-i="${i}"><small>0${i+1} · ${p.kind}</small><h3>${p.name}</h3><p>${p.desc}</p><ul>${p.tags.map(t=>`<li>${t}</li>`).join("")}</ul>${p.repo?`<a class="lnk" href="${p.repo}">GitHub'da incele →</a>`:`<span class="lnk priv">🔒 Özel repo</span>`}</div>`).join("");
const items=[...stage.querySelectorAll(".dev-phone,.dev-win")];
const show=i=>{items.forEach((el,k)=>el.classList.toggle("on",k===i));document.querySelectorAll(".st").forEach((s,k)=>s.classList.toggle("act",k===i));glow.style.background=P[i].accent};show(0);
const io2=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&show(+e.target.dataset.i)),{rootMargin:"-45% 0px -45% 0px"});document.querySelectorAll(".st").forEach(s=>io2.observe(s));
const skills=[["Fikir & ürün tasarımı","Problemi bulup ekranları, akışları ve özellikleri kurguluyorum; neyin önemli olduğuna karar veriyorum."],["AI ile geliştirme","Devin, Claude ve ChatGPT gibi AI ajanlarına işi tarif edip kodu yazdırıyorum; çıktıyı inceleyip yönlendiriyorum."],["Test","Uygulamayı simülatörde ve telefonda deneyip hataları buluyor, düzelttiriyorum."],["Yayına alma","TestFlight, EAS / OTA güncellemeleri, GitHub Pages, alan adı ve DNS."],["Veri & entegrasyon","Spor fikstürü, harita/rota, hukuk kaynakları gibi gerçek veri kaynaklarını ürüne bağlatmak."],["Projelerde kullanılan teknolojiler","React Native, Expo, Next.js, Supabase, Python / FastAPI, MapLibre, Gemini"]];
const tech=["React Native","Expo","TypeScript","Next.js","Supabase","PostgreSQL","Prisma","Python","FastAPI","MapLibre","TailwindCSS","Gemini","Zustand","Deno"];
bento.innerHTML=`<div class="t s2 about reveal"><div class="av"></div><div><h3>${ME.name}</h3><div class="role">${ME.role}</div><p>Klasik anlamda yazılımcı değilim; “vibe coding” ile çalışıyorum. Neyin yapılacağına ve kullanıcı deneyimine ben karar veriyorum, kodu AI yazıyor. Bu şekilde tek başıma 5 ürünü fikirden yayına taşıdım.</p></div></div>
<div class="t stat reveal"><b>5</b><span>AI ile geliştirdiğim ürün</span></div>
<div class="t stat reveal"><span><i class="dot"></i> Şu an</span><b style="font-size:24px;margin-top:10px;line-height:1.2">SportPulse'u geliştiriyorum</b></div>
${skills.map(([h,p],i)=>`<div class="t ${i<2?"s2":""} reveal"><h4>${h}</h4><p>${p}</p></div>`).join("")}
<div class="marq-w"><div class="marq">${[0,1].map(()=>tech.map(t=>`<span>${t}</span>`).join("")).join("")}</div></div>`;
contactg.innerHTML=`<div class="t s2 cv reveal"><h4>Özgeçmiş</h4><b>CV'mi PDF olarak<br>indirebilirsin.</b><a class="dl" href="#">CV'yi indir ↓</a></div>
<div class="t s2 mail reveal"><h4>E-posta</h4><b>${ME.mail}</b><button onclick="navigator.clipboard.writeText('${ME.mail}');this.textContent='Kopyalandı ✓'">Kopyala</button></div>
<a class="t s2 soc reveal" href="${ME.gh}"><span class="ar">→</span><h4 lang="en">GitHub</h4><b>@arslanberke</b><p>Açık kaynak projelerim ve kodlarım</p></a>
<a class="t s2 soc reveal" href="#"><span class="ar">→</span><h4 lang="en">LinkedIn</h4><b>Berke Arslan</b><p>Profesyonel profilim</p></a>`;
observeReveal();
addEventListener("pointermove",e=>{document.body.style.setProperty("--x",e.clientX+"px");document.body.style.setProperty("--y",e.clientY+"px");const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;stack.style.transform=`rotateY(${x*10}deg) rotateX(${-y*8}deg)`});
</script></body></html>
