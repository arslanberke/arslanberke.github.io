<!doctype html><html lang="tr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 · Aurora</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="frames.css">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;background:#07080d;color:#e9ebf2;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(80px) saturate(140%);opacity:.55}
.bg span{position:absolute;width:45vmax;height:45vmax;border-radius:50%;animation:float 18s ease-in-out infinite alternate}
.bg span:nth-child(1){background:#6d5dfc;top:-15%;left:-10%}.bg span:nth-child(2){background:#10b981;bottom:-20%;right:-10%;animation-delay:-6s}.bg span:nth-child(3){background:#ec4899;top:30%;left:40%;width:30vmax;height:30vmax;animation-delay:-12s}
@keyframes float{to{transform:translate(12vw,8vh) scale(1.2)}}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:22px;padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);z-index:10;font-size:14px}
nav a{color:#c8cbe0;text-decoration:none}nav a:hover{color:#fff}
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;max-width:1200px;margin:auto;padding:120px 24px 60px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:rgba(16,185,129,.12);color:#6ee7b7;font-size:13px;border:1px solid rgba(16,185,129,.3)}
.badge i{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 0 #10b981;animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
h1{font-size:clamp(44px,7vw,88px);line-height:1;letter-spacing:-.04em;margin:22px 0;font-weight:800}
h1 span{background:linear-gradient(90deg,#a5b4fc,#6ee7b7,#f9a8d4,#a5b4fc);background-size:300%;-webkit-background-clip:text;color:transparent;animation:shine 8s linear infinite}@keyframes shine{to{background-position:300%}}
.lead{font-size:18px;color:#a3a8c3;max-width:520px;line-height:1.6}
.btns{display:flex;gap:12px;margin-top:30px}.btn{padding:13px 22px;border-radius:12px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);font-weight:600}.btn.p{background:#fff;color:#07080d}
.stack{position:relative;height:620px;perspective:1200px}
.stack .dev-phone{position:absolute;width:250px;transition:transform .3s}
.stack .a{left:8%;top:40px;transform:rotate(-8deg);animation:bob 6s ease-in-out infinite}.stack .b{left:38%;top:0;z-index:2;animation:bob 6s -2s ease-in-out infinite}.stack .c{left:66%;top:70px;transform:rotate(8deg);animation:bob 6s -4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -18px}}
section{max-width:1200px;margin:auto;padding:80px 24px}h2{font-size:44px;letter-spacing:-.03em;margin-bottom:40px}
.card{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:40px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(20px);margin-bottom:28px;transform-style:preserve-3d;transition:transform .2s}
.card:nth-child(even) .media{order:-1}
.kind{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8b90ad}.card h3{font-size:34px;margin:8px 0 14px;letter-spacing:-.02em}.card p{color:#b2b6cc;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.tags span{font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.07);color:#d6d9ea}
.media{display:flex;justify-content:center;gap:16px}.media .dev-phone{width:200px}.media .dev-phone:nth-child(2){margin-top:50px}.media .dev-win{width:100%}
footer{text-align:center;padding:60px;color:#6b7090}
@media(max-width:860px){.hero,.card{grid-template-columns:1fr}.stack{height:440px}.stack .dev-phone{width:170px}.card:nth-child(even) .media{order:0}.media .dev-phone{width:150px}}
</style></head><body>
<div class="bg"><span></span><span></span><span></span></div>
<nav><a href="#">berke.cc</a><a href="#work">Projeler</a><a href="#">İletişim</a><a href="#">EN</a></nav>
<header class="hero"><div><span class="badge"><i></i>Yeni projelere açığım</span><h1>Berke Arslan<br><span>ürün geliştirir.</span></h1><p class="lead" id="lead"></p>
<div class="btns"><a class="btn p" href="#work">Projeler</a><a class="btn" href="https://github.com/arslanberke">GitHub</a></div></div>
<div class="stack" id="stack"></div></header>
<section id="work"><h2>Seçili işler</h2><div id="list"></div></section><footer>© 2026 Berke Arslan</footer>
<script src="data.js"></script><script src="reveal.js"></script><script>
lead.textContent=ME.lead;const P=PROJECTS;
stack.innerHTML=frame(P[1],0,"a")+frame(P[0],0,"b")+frame(P[4],0,"c");
list.innerHTML=P.map(p=>`<article class="card reveal"><div><div class="kind">${p.kind}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div></div><div class="media">${p.type==="phone"?frame(p,0)+(p.shots[1]?frame(p,1):""):frame(p,0)}</div></article>`).join("");
observeReveal();
document.querySelectorAll(".card").forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(1200px) rotateY(${x*4}deg) rotateX(${-y*4}deg)`};c.onmouseleave=()=>c.style.transform=""});
addEventListener("mousemove",e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;stack.style.transform=`rotateY(${x*10}deg) rotateX(${-y*8}deg)`});
</script></body></html>
